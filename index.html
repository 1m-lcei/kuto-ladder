<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
  <link rel="stylesheet" href="/src/styles.css" />
  <title>戦術対抗戦 経路</title>
  <meta name="description" content="戦術対抗戦 (PvP) の順位経路を計算・表示するWebアプリです。" />
  <meta property="og:title" content="戦術対抗戦 順位経路表示ツール" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://1m-lcei.github.io/kuto-ladder/" />
  <meta property="og:description" content="戦術対抗戦 (PvP) の順位経路を計算・表示するWebアプリです。" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:image" content="https://1m-lcei.github.io/kuto-ladder/ogp.webp" />
  <meta property="og:image:type" content="image/webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="戦術対抗戦の順位経路を表示するWebアプリイメージ画像" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>
    window.applyTheme = (theme) => {
      const dark = theme === "night";
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="color-scheme"]').content = dark ? "dark" : "light";
      for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.content = dark ? "#0f172a" : "#ffffff";
    };
    (() => {
      let theme;
      try {
        const config = JSON.parse(localStorage.getItem("kuto-ladder-config"));
        if (config?.version === 1) {
          if (config.theme === "dark" || config.theme === "night") theme = "night";
          else if (config.theme === "light" || config.theme === "emerald") theme = "emerald";
        }
      } catch {}
      window.applyTheme(theme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "emerald"));
    })();
  </script>
</head>
<body>
  <div class="page">
    <nav class="toolbar" aria-label="表示とリンク">
      <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="テーマを切り替える">
        <svg class="sun" aria-hidden="true">
          <use href="./icons.svg#sun"></use>
        </svg>
        <svg class="moon" aria-hidden="true">
          <use href="./icons.svg#moon"></use>
        </svg>
      </button>
      <button id="menu-trigger" class="icon-button" type="button" popovertarget="header-menu" aria-label="メニュー" hidden>
        <svg class="menu-icon" aria-hidden="true">
          <use href="./icons.svg#menu"></use>
        </svg>
      </button>
      <div id="header-menu" popover="auto">
        <fieldset class="theme-settings">
          <legend>テーマ</legend>
          <div class="theme-options">
            <label><input type="radio" name="theme" value="system" checked />システム</label>
            <label><input type="radio" name="theme" value="light" />ライト</label>
            <label><input type="radio" name="theme" value="dark" />ダーク</label>
          </div>
        </fieldset>
        <button id="about-trigger" class="menu-item" type="button" aria-haspopup="dialog" aria-controls="about-dialog">このサイトについて</button>
      </div>
    </nav>
    <main>
      <header><h1>戦術対抗戦 経路</h1></header>
      <noscript>
        <p class="script-notice">
          <svg class="error-icon" aria-hidden="true">
            <use href="./icons.svg#warning"></use>
          </svg>
          <span>JavaScriptが無効になっているため、経路を計算できません。ブラウザーの設定で有効にして、ページを再読み込みしてください。</span>
        </p>
      </noscript>
      <form novalidate class="rank-card">
        <div class="rank-fields">
          <div class="rank-entry">
            <label for="rank">開始順位</label>
            <!-- type を number にすると、初回入力では submit しないと validate してくれない -->
            <!-- Optional leading zeros; 2–9, 10–9999, 10000–14999, 15000–15001. -->
            <input id="rank" type="text" inputmode="numeric" pattern="[0０]*([2-9２-９]|[1-9１-９][0-9０-９]{1,3}|[1１][0-4０-４][0-9０-９]{3}|[1１][5５][0０]{2}[0-1０-１])" required aria-describedby="rank-hint" placeholder="2 ～ 15001" />
          </div>
          <select name="strategy" aria-label="経路戦略">
            <button type="button"><selectedcontent></selectedcontent></button>
            <option value="efficient">
              <span aria-hidden="true">
                <svg class="strategy-icon" aria-hidden="true">
                  <!-- option 中に SVG を含むのは 2026年9月現在、Firefox が対応していないため、title を alt として使う -->
                  <title>🥇</title>
                  <use href="./icons.svg#crown"></use>
                </svg>
              </span>
              <span class="strategy-label">登頂</span>
            </option>
            <option value="target-second">
              <span aria-hidden="true">
                <svg class="strategy-icon" aria-hidden="true">
                  <title>🥈</title>
                  <use href="./icons.svg#second"></use>
                </svg>
              </span>
              <span class="strategy-label">2位狙い</span>
            </option>
            <option value="match-heavy">
              <span aria-hidden="true">
                <svg class="strategy-icon" aria-hidden="true">
                  <title>⚔</title>
                  <use href="./icons.svg#sword"></use>
                </svg>
              </span>
              <span class="strategy-label">最多対戦</span>
            </option>
          </select>
        </div>
        <p id="rank-hint" role="alert">
          <svg class="error-icon" aria-hidden="true">
            <use href="./icons.svg#error"></use>
          </svg>
          <span>2〜15001の整数を入力してください。</span>
        </p>
      </form>
      <article id="result" aria-live="polite"></article>
    </main>
  </div>
  <dialog id="about-dialog" aria-labelledby="about-title" closedby="any">
    <section>
      <img class="about-icon" src="/favicon.svg" alt="" width="76" height="76" />
      <h2 id="about-title">このサイトについて</h2>
      <p class="about-description">「ブルーアーカイブ」非公式ファンサイトです。</p>
      <hr />
      <!-- biome-ignore lint/a11y/noRedundantRoles: Restores list semantics with list-style:none in Safari. -->
      <ul class="about-links" role="list">
          <li>
            <a href="https://x.com/1m_lcei" target="_blank" rel="noopener noreferrer">
              <svg class="link-icon" aria-hidden="true">
                <use href="./icons.svg#x"></use>
              </svg>
              連絡先
            </a>
          </li>
          <li>
            <a href="https://github.com/1m-lcei/kuto-ladder" target="_blank" rel="noopener noreferrer">
              <svg class="link-icon" aria-hidden="true">
                <use href="./icons.svg#github"></use>
              </svg>
              GitHub
            </a>
          </li>
      </ul>
    </section>
  </dialog>
  <template id="path-step">
    <li class="rank-step">
      <div class="rank-detail">
        <span class="rank-number"></span>
        <div class="rank-range">
          (<svg class="range-arrow" aria-hidden="true">
            <use href="./icons.svg#chevron"></use>
          </svg>
        </div>
      </div>
    </li>
  </template>
  <template id="result-alert">
    <div class="result-alert error" role="alert">
      <svg class="error-icon" aria-hidden="true">
        <use href="./icons.svg#error"></use>
      </svg>
      <span></span>
    </div>
  </template>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
