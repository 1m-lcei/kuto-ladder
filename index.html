  <meta property="og:description" content="戦術対抗戦 (PvP) の順位経路を計算・表示するWebアプリです。" />

  <meta property="og:image:alt" content="戦術対抗戦の順位経路を表示するWebアプリイメージ画像" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>
    window.applyTheme = (theme) => {
      const dark = theme === "night";
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="color-scheme"]').content = dark ? "dark" : "light";
      for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.content = dark ? "#0f172a" : "#ffffff";
    };
    (() => {
      let theme;
      try {
        const config = JSON.parse(localStorage.getItem("kuto-ladder-config"));
        if (config?.version === 1) {
          if (config.theme === "dark" || config.theme === "night") theme = "night";
          else if (config.theme === "light" || config.theme === "emerald") theme = "emerald";
        }
      } catch {}
      window.applyTheme(theme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "emerald"));
    })();
  </script>
</head>
<body>
  <div class="page">
    <nav class="toolbar" aria-label="表示とリンク">
      <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="システムと反対のテーマにする">
        <svg class="sun" aria-hidden="true" width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" >
          <title>Light mode</title>

        </svg>
        <svg class="moon" aria-hidden="true" width="24" height="24" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" >
          <title>Dark mode</title>
          <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"></path>
        </svg>
      </button>
      <button id="menu-trigger" class="icon-button" type="button" popovertarget="header-menu" aria-label="メニュー" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="menu-icon" aria-hidden="true" >

        </svg>
      </button>
      <div id="header-menu" popover="auto">
        <fieldset class="theme-settings">
          <legend>テーマ</legend>
          <div class="theme-options">
            <label><input type="radio" name="theme" value="system" checked />システム</label>
            <label><input type="radio" name="theme" value="light" />ライト</label>
            <label><input type="radio" name="theme" value="dark" />ダーク</label>
          </div>
        </fieldset>
        <button id="about-trigger" class="menu-item" type="button" aria-haspopup="dialog" aria-controls="about-dialog">このサイトについて</button>
      </div>

    <main>
      <header><h1>戦術対抗戦 経路</h1></header>
      <noscript>
        <p class="script-notice">
          <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3 2 21h20L12 3Zm0 6v5m0 3h.01" />
          </svg>
          <span>JavaScriptが無効になっているため、経路を計算できません。ブラウザーの設定で有効にして、ページを再読み込みしてください。</span>
        </p>
      </noscript>
      <form novalidate class="rank-card">
        <div class="rank-fields">
          <div class="rank-entry">
            <label for="rank">開始順位</label>
            <!-- type を number にすると、初回入力では submit しないと validate してくれない -->
            <!-- Optional leading zeros; 2–9, 10–9999, 10000–14999, 15000–15001. -->
            <input id="rank" type="text" inputmode="numeric" pattern="[0０]*([2-9２-９]|[1-9１-９][0-9０-９]{1,3}|[1１][0-4０-４][0-9０-９]{3}|[1１][5５][0０]{2}[0-1０-１])" required aria-describedby="rank-hint" placeholder="2 ～ 15001" />
          </div>
          <select name="strategy" aria-label="経路戦略">
            <button type="button"><selectedcontent></selectedcontent></button>
            <option value="efficient">
              <span aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="1.125rem" height="1.125rem" viewBox="0 0 24 24" aria-hidden="true">
                  <!-- option 中に SVG を含むのは 2026年9月現在、Firefox が対応していないため、title を alt として使う -->
                  <title>🥇</title>
                  <path d="M0 0h24v24H0z" fill="none" /><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m12 6l4 6l5-4l-2 10H5L3 8l5 4z" />
                </svg>
              </span>
              <span class="strategy-label">登頂</span>
            </option>
            <option value="target-second">
              <span aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="1.125rem" height="1.125rem" viewBox="0 0 24 24" aria-hidden="true">
                  <title>🥈</title>
                  <path d="M0 0h24v24H0z" fill="none" />
                  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                    <path d="M10 8h3a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h3" />
                    <path d="M5 7.2A2.2 2.2 0 0 1 7.2 5h1a2.2 2.2 0 0 0 1.55-.64l.7-.7a2.2 2.2 0 0 1 3.12 0l.7.7c.412.41.97.64 1.55.64h1a2.2 2.2 0 0 1 2.2 2.2v1c0 .58.23 1.138.64 1.55l.7.7a2.2 2.2 0 0 1 0 3.12l-.7.7a2.2 2.2 0 0 0-.64 1.55v1a2.2 2.2 0 0 1-2.2 2.2h-1a2.2 2.2 0 0 0-1.55.64l-.7.7a2.2 2.2 0 0 1-3.12 0l-.7-.7a2.2 2.2 0 0 0-1.55-.64h-1a2.2 2.2 0 0 1-2.2-2.2v-1a2.2 2.2 0 0 0-.64-1.55l-.7-.7a2.2 2.2 0 0 1 0-3.12l.7-.7A2.2 2.2 0 0 0 5 8.2z" />
                  </g>
                </svg>
              </span>
              <span class="strategy-label">2位狙い</span>
            </option>
            <option value="match-heavy">
              <span aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="1.125rem" height="1.125rem" viewBox="0 0 24 24" aria-hidden="true">
                  <title>⚔</title>
                  <path d="M0 0h24v24H0z" fill="none" />
                  <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 4v5l-9 7l-4 4l-3-3l4-4l7-9zM6.5 11.5l6 6" />
                </svg>
              </span>
              <span class="strategy-label">最多対戦</span>
            </option>
          </select>
        </div>
        <p id="rank-hint" role="alert">
          <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>2〜15001の整数を入力してください。</span>
        </p>
      </form>
      <article id="result" aria-live="polite"></article>
    </main>
  </div>

              </svg>
              GitHub

          </li>
      </ul>
    </section>
  </dialog>
  <template id="path-step">
    <li class="rank-step">
      <div class="rank-detail">
        <span class="rank-number"></span>
        <div class="rank-range">
          (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="range-arrow" aria-hidden="true">
            <path fill="currentColor" d="M6.23 20.23L8 22l10-10L8 2L6.23 3.77L14.46 12z" />
          </svg>
        </div>
      </div>
    </li>
  </template>
  <template id="result-alert">
    <div class="result-alert error" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="error-icon" aria-hidden="true">
